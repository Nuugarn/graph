<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room 3D Viewer</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Segoe UI", Tahoma, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: #17212b; background: #edf0f3; }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .badge { position: fixed; z-index: 2; right: 18px; bottom: 16px; padding: 7px 10px; border-radius: 999px; color: #596572; background: rgba(255,255,255,.78); font-size: 11px; }
    @media (max-width: 600px) {
      .badge { right: 10px; bottom: 10px; }
    }
  </style>
</head>
<body>
  <div id="stage" aria-label="โมเดลห้องสามมิติ"></div>
  <div class="badge">ลากเพื่อหมุน · คลิกบานเพื่อเปิด</div>

  <!-- Three.js is loaded from a pinned CDN version, so this file needs an internet connection. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    (() => {
      const stage = document.getElementById('stage');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x101826);
      scene.fog = new THREE.Fog(0x101826, 13, 25);

      const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 60);
      const initialCamera = new THREE.Vector3(5.3, 4.0, 7.8);
      camera.position.copy(initialCamera);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setClearColor(0x101826, 1);
      stage.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      const initialTarget = new THREE.Vector3(0, 1.3, -1.25);
      controls.target.copy(initialTarget);
      controls.enableDamping = true;
      controls.dampingFactor = 0.075;
      controls.minDistance = 4.2;
      controls.maxDistance = 12;
      controls.maxPolarAngle = Math.PI * 0.49;

      scene.add(new THREE.HemisphereLight(0xdbe5ff, 0x403b3a, 0.9));
      const keyLight = new THREE.DirectionalLight(0xffe6cc, 1.35);
      keyLight.position.set(-3.5, 7, 5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.camera.left = -7;
      keyLight.shadow.camera.right = 7;
      keyLight.shadow.camera.top = 7;
      keyLight.shadow.camera.bottom = -5;
      keyLight.shadow.bias = -0.0005;
      scene.add(keyLight);

      const mats = {
        wall: new THREE.MeshStandardMaterial({ color: 0xf5f3ef, roughness: 0.94 }),
        sideWall: new THREE.MeshStandardMaterial({ color: 0xf1efeb, roughness: 0.95 }),
        floor: new THREE.MeshStandardMaterial({ color: 0xa77c55, roughness: 0.86 }),
        floorLine: new THREE.MeshStandardMaterial({ color: 0x916944, roughness: 0.9 }),
        dark: new THREE.MeshStandardMaterial({ color: 0x34383b, roughness: 0.88 }),
        darkEdge: new THREE.MeshStandardMaterial({ color: 0x474c50, roughness: 0.84 }),
        white: new THREE.MeshStandardMaterial({ color: 0xf4f4f1, roughness: 0.82 }),
        whiteEdge: new THREE.MeshStandardMaterial({ color: 0xe8e8e4, roughness: 0.76 }),
        console: new THREE.MeshStandardMaterial({ color: 0x3b4043, roughness: 0.88 }),
        metal: new THREE.MeshStandardMaterial({ color: 0x8e969a, metalness: 0.12, roughness: 0.68 }),
        glass: new THREE.MeshStandardMaterial({ color: 0xe5eef0, transparent: true, opacity: 0.15, roughness: 0.42, metalness: 0.01, side: THREE.DoubleSide, depthWrite: false }),
        glassEdge: new THREE.MeshStandardMaterial({ color: 0xd4d8d6, roughness: 0.38 })
      };

      function box(parent, w, h, d, x, y, z, material, cast = true, receive = true) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
        mesh.position.set(x, y, z);
        mesh.castShadow = cast;
        mesh.receiveShadow = receive;
        parent.add(mesh);
        return mesh;
      }

      // Open-front room shell: the ceiling is omitted so the furniture stays visible while orbiting.
      const room = new THREE.Group();
      scene.add(room);
      const backWallOpeningStart = 0.61;
      const backWallLeft = -2.75;
      const remainingBackWallWidth = backWallOpeningStart - backWallLeft;
      const remainingBackWallCenter = (backWallLeft + backWallOpeningStart) / 2;
      box(room, 5.5, 0.12, 4.9, 0, -0.06, 0.18, mats.floor, false, true);
      box(room, remainingBackWallWidth, 2.95, 0.12, remainingBackWallCenter, 1.475, -2.27, mats.wall, false, true);
      box(room, 0.12, 2.95, 4.9, -2.75, 1.475, 0.18, mats.sideWall, false, true);
      box(room, 0.12, 2.95, 4.9, 2.75, 1.475, 0.18, mats.sideWall, false, true);
      box(room, remainingBackWallWidth, 0.12, 0.035, remainingBackWallCenter, 0.08, -2.17, mats.whiteEdge, false, true);

      // Warm wood floor seams, kept subtle so the room remains clean.
      for (let i = 0; i < 11; i++) {
        const x = -2.5 + i * 0.5;
        box(room, 0.009, 0.002, 4.68, x, 0.004, 0.18, mats.floorLine, false, false);
      }
      for (let row = 0; row < 7; row++) {
        const z = -1.9 + row * 0.68;
        for (let col = 0; col < 3; col++) {
          const x = -1.95 + col * 1.85 + (row % 2 ? 0.35 : 0);
          box(room, 0.42, 0.002, 0.009, x, 0.005, z, mats.floorLine, false, false);
        }
      }

      // Low gray console on the left wall.
      const consoleGroup = new THREE.Group();
      scene.add(consoleGroup);
      const consoleX = -1.38;
      const consoleY = 0.47;
      const consoleZ = -1.78;
      box(consoleGroup, 2.28, 0.48, 0.58, consoleX, consoleY, consoleZ, mats.console);
      box(consoleGroup, 2.30, 0.055, 0.62, consoleX, 0.735, consoleZ + 0.01, mats.darkEdge);
      for (let i = 0; i < 3; i++) {
        const panelX = -2.12 + i * 0.74;
        box(consoleGroup, 0.72, 0.43, 0.025, panelX, 0.47, -1.475, mats.dark);
        box(consoleGroup, 0.006, 0.37, 0.008, panelX + 0.35, 0.47, -1.456, mats.darkEdge, false, false);
      }

      // Empty white two-door display cabinet, fitted from the console up to the ceiling line.
      const cab = new THREE.Group();
      scene.add(cab);
      const cabLeft = -2.62;
      const cabRight = -0.34;
      const cabWidth = cabRight - cabLeft;
      const cabBottom = 0.77;
      const cabTop = 2.88;
      const cabHeight = cabTop - cabBottom;
      const cabDepth = 0.62;
      const cabBackZ = -2.16;
      const cabFrontZ = cabBackZ + cabDepth;
      const cabX = (cabLeft + cabRight) / 2;
      const cabCenterZ = (cabBackZ + cabFrontZ) / 2;
      const board = 0.055;
      box(cab, cabWidth, cabHeight, 0.055, cabX, cabBottom + cabHeight / 2, cabBackZ + 0.035, mats.whiteEdge);
      box(cab, board, cabHeight, cabDepth, cabLeft + board / 2, cabBottom + cabHeight / 2, cabCenterZ, mats.white);
      box(cab, board, cabHeight, cabDepth, cabRight - board / 2, cabBottom + cabHeight / 2, cabCenterZ, mats.white);
      box(cab, cabWidth, board, cabDepth, cabX, cabBottom + board / 2, cabCenterZ, mats.white);
      box(cab, cabWidth, board, cabDepth, cabX, cabTop - board / 2, cabCenterZ, mats.white);
      const interiorWidth = cabWidth - board * 2;
      const shelfCount = 5;
      for (let i = 1; i <= shelfCount; i++) {
        const y = cabBottom + (cabHeight / (shelfCount + 1)) * i;
        box(cab, interiorWidth - 0.04, 0.035, cabDepth - 0.12, cabX, y, cabCenterZ + 0.035, mats.whiteEdge);
      }

      const openingWidth = cabWidth - board * 2;
      const doorOverlap = 0.08;
      const doorWidth = openingWidth / 2 + doorOverlap / 2;
      const doorHeight = cabHeight - 0.07;
      const doorThickness = 0.035;
      const rail = 0.055;
      const slideDistance = openingWidth / 2;
      const doors = [];

      // Twin sliding tracks sit at the top and bottom of the cabinet opening.
      const trackDepth = 0.035;
      const trackZs = [cabFrontZ + 0.045, cabFrontZ + 0.095];
      for (const z of trackZs) {
        box(cab, openingWidth, 0.025, trackDepth, cabX, cabBottom + 0.015, z, mats.whiteEdge);
        box(cab, openingWidth, 0.025, trackDepth, cabX, cabTop - 0.015, z, mats.whiteEdge);
      }

      function createDoor(id, closedX, slideDirection, z, handleSide) {
        const door = new THREE.Group();
        door.position.set(closedX, cabBottom + 0.035 + doorHeight / 2, z);
        door.userData.doorAction = id;
        door.userData.isOpen = false;
        door.userData.closedX = closedX;
        door.userData.slideDirection = slideDirection;
        scene.add(door);

        // Transparent hit surface makes the whole glass leaf clickable.
        box(door, doorWidth, doorHeight, doorThickness, 0, 0, 0.018,
          new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }), false, false);
        box(door, doorWidth - rail * 2, doorHeight - rail * 2, 0.012, 0, 0, 0.018, mats.glass, false, false);
        box(door, rail, doorHeight, doorThickness, -doorWidth / 2 + rail / 2, 0, 0.025, mats.white);
        box(door, rail, doorHeight, doorThickness, doorWidth / 2 - rail / 2, 0, 0.025, mats.white);
        box(door, doorWidth, rail, doorThickness, 0, -doorHeight / 2 + rail / 2, 0.025, mats.white);
        box(door, doorWidth, rail, doorThickness, 0, doorHeight / 2 - rail / 2, 0.025, mats.white);

        // Slim recessed finger pull at the meeting edge.
        const handleX = handleSide === 'right' ? doorWidth / 2 - rail * 0.72 : -doorWidth / 2 + rail * 0.72;
        box(door, 0.018, 0.19, 0.012, handleX, 0, 0.044, mats.darkEdge, false, false);
        doors.push(door);
        return door;
      }

      const openingLeft = cabLeft + board;
      const openingRight = cabRight - board;
      const leftClosedX = openingLeft + doorWidth / 2;
      const rightClosedX = openingRight - doorWidth / 2;
      createDoor('ซ้าย', leftClosedX, 1, trackZs[0], 'right');
      createDoor('ขวา', rightClosedX, -1, trackZs[1], 'left');

      // Tall charcoal open shelving unit in the foreground.
      const shelf = new THREE.Group();
      scene.add(shelf);
      const shelfX = 0.12;
      const shelfZ = -1.85;
      const shelfW = 0.94;
      const shelfH = 2.88;
      const shelfD = 0.72;
      const shelfBottom = 0.02;
      const shelfBoard = 0.075;
      box(shelf, shelfW, shelfH, 0.07, shelfX, shelfBottom + shelfH / 2, shelfZ - shelfD / 2 + 0.035, mats.dark);
      box(shelf, shelfBoard, shelfH, shelfD, shelfX - shelfW / 2 + shelfBoard / 2, shelfBottom + shelfH / 2, shelfZ, mats.darkEdge);
      box(shelf, shelfBoard, shelfH, shelfD, shelfX + shelfW / 2 - shelfBoard / 2, shelfBottom + shelfH / 2, shelfZ, mats.darkEdge);
      box(shelf, shelfW, shelfBoard, shelfD, shelfX, shelfBottom + shelfBoard / 2, shelfZ, mats.darkEdge);
      box(shelf, shelfW, shelfBoard, shelfD, shelfX, shelfBottom + shelfH - shelfBoard / 2, shelfZ, mats.darkEdge);
      for (let i = 1; i <= 5; i++) {
        const y = shelfBottom + (shelfH / 6) * i;
        box(shelf, shelfW - shelfBoard * 2, shelfBoard, shelfD, shelfX, y, shelfZ, mats.darkEdge);
      }

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let pointerDown = null;

      function toggleDoor(door) {
        const shouldOpen = !door.userData.isOpen;
        doors.forEach(other => {
          if (other !== door) other.userData.isOpen = false;
        });
        door.userData.isOpen = shouldOpen;
      }

      function findDoor(node) {
        while (node) {
          if (node.userData && node.userData.doorAction) return node;
          node = node.parent;
        }
        return null;
      }

      renderer.domElement.addEventListener('pointerdown', event => {
        pointerDown = { x: event.clientX, y: event.clientY };
      });
      renderer.domElement.addEventListener('pointerup', event => {
        if (!pointerDown) return;
        const moved = Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y);
        pointerDown = null;
        if (moved > 5) return;
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(doors, true).find(item => findDoor(item.object));
        if (hit) toggleDoor(findDoor(hit.object));
      });

      renderer.domElement.addEventListener('pointermove', event => {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(doors, true).some(item => findDoor(item.object));
        renderer.domElement.style.cursor = hit ? 'pointer' : 'grab';
      });

      function resize() {
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      }
      window.addEventListener('resize', resize);
      resize();

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const t = 1 - Math.exp(-clock.getDelta() * 3.2);
        doors.forEach(door => {
          const target = door.userData.closedX + (door.userData.isOpen ? door.userData.slideDirection * slideDistance : 0);
          door.position.x += (target - door.position.x) * t;
        });
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
</body>
</html>
